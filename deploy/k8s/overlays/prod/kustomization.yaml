apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: ConfigMap, name: beast-config}
    patch: |-
      - {op: replace, path: /data/ENTRA_TENANT_ID, value: "REPLACE-WITH-TENANT-ID"}
  - target: {kind: Ingress, name: mcp}
    patch: |-
      - {op: replace, path: /metadata/annotations/nginx.ingress.kubernetes.io~1whitelist-source-range, value: "REPLACE-WITH-APIM-OUTBOUND-IPS"}
