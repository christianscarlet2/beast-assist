apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beast-assist
labels:
  - pairs: {app.kubernetes.io/part-of: beast-assist}
resources:
  - namespace.yaml
  - configmap.yaml
  - agile-mcp.yaml
  - college-mcp.yaml
  - registry.yaml
  - postgres.yaml
  - ingress.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: opa-policy
    files: [policy/tools.rego]   # a copy of /policy/tools.rego; tests/test_deploy.py keeps them identical
    options: {disableNameSuffixHash: true}
images:
  - {name: beast-assist, newName: ghcr.io/christianscarlet2/beast-assist, newTag: "0.1.0"}
