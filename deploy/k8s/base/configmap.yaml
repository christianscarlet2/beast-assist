apiVersion: v1
kind: ConfigMap
metadata: {name: beast-config}
data:
  BEAST_ENV: prod
  # Entra ID: the servers derive issuer and JWKS URL from the tenant id
  ENTRA_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  AUTH_AUDIENCE: api://beast-assist
  OPA_URL: http://localhost:8181          # OPA runs as a sidecar in each MCP pod
  COLLEGE_BASE: https://college.scarletbeast.com
  AGILE_API_BASE: https://living.scarletbeast.com/api/agile
  EMBEDDINGS: local
  ALLOWED_HOSTS: "mcp.scarletbeast.com,agile-mcp,college-mcp"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
---
apiVersion: v1
kind: ConfigMap
metadata: {name: opa-config}
data:
  config.yaml: |
    services:
      registry: {url: "http://skills-registry"}
    bundles:
      beast: {service: registry, resource: /bundles/beast.tar.gz, polling: {min_delay_seconds: 10, max_delay_seconds: 30}}
    decision_logs: {console: true}
