apiVersion: apps/v1
kind: Deployment
metadata:
  name: agile-mcp
  labels: {app: agile-mcp, tier: mcp}
spec:
  replicas: 2
  selector: {matchLabels: {app: agile-mcp}}
  template:
    metadata:
      labels: {app: agile-mcp, tier: mcp}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: server
          image: beast-assist
          env: [{name: SERVICE, value: agile-mcp}]
          envFrom: [{configMapRef: {name: beast-config}}, {secretRef: {name: beast-secrets}}]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, failureThreshold: 3}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 40}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
        - name: opa
          image: openpolicyagent/opa:1.4.2
          args: ["run", "--server", "--addr=127.0.0.1:8181", "--config-file=/cfg/config.yaml", "/policy"]
          readinessProbe: {httpGet: {path: "/health?bundles", port: 8181, host: 127.0.0.1}, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: opa-config, mountPath: /cfg}
            - {name: policy, mountPath: /policy}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: opa-config, configMap: {name: opa-config}}
        - {name: policy, configMap: {name: opa-policy}}
---
apiVersion: v1
kind: Service
metadata: {name: agile-mcp, labels: {app: agile-mcp}}
spec:
  selector: {app: agile-mcp}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: agile-mcp}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agile-mcp}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: agile-mcp}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: agile-mcp}}
