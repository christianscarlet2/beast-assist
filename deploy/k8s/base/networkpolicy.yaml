# Default deny inside the namespace; MCP pods take traffic only from the ingress controller, the
# registry only from MCP pods (OPA bundle pulls), postgres only from the registry and college-mcp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mcp-from-ingress}
spec:
  podSelector: {matchLabels: {tier: mcp}}
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: registry-from-mcp}
spec:
  podSelector: {matchLabels: {app: skills-registry}}
  ingress:
    - from: [{podSelector: {matchLabels: {tier: mcp}}}]
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-clients}
spec:
  podSelector: {matchLabels: {app: postgres}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: skills-registry}}}, {podSelector: {matchLabels: {app: college-mcp}}}]
      ports: [{port: 5432}]
