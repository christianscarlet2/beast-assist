# NOT applied by kustomize: create the real secret out of band, e.g.
#   kubectl -n beast-assist create secret generic beast-secrets \
#     --from-literal=AGILE_API_TOKEN=... --from-literal=RAG_DSN=postgresql://... --from-literal=REGISTRY_DSN=postgresql://...
# or sync it from Azure Key Vault with the Secrets Store CSI driver.
apiVersion: v1
kind: Secret
metadata: {name: beast-secrets, namespace: beast-assist}
type: Opaque
stringData:
  AGILE_API_TOKEN: replace-me
  RAG_DSN: postgresql://beast:replace-me@postgres:5432/beast
  REGISTRY_DSN: postgresql://beast:replace-me@postgres:5432/beast
