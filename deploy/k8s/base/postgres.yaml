# In-cluster PostgreSQL + pgvector for dev. In production point RAG_DSN / REGISTRY_DSN at a managed
# server (Azure Database for PostgreSQL flexible server supports the vector extension) and drop this.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - {name: POSTGRES_USER, value: beast}
            - {name: POSTGRES_DB, value: beast}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: beast-postgres, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pg}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, beast]}, periodSeconds: 10}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432}]
