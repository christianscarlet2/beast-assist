name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,agent]"
      - name: Unit tests (servers over real MCP HTTP, auth, scope, skills, RAG chunking)
        run: pytest -q
      - name: Skill gates
        run: |
          python scripts/validate_skills.py
          python scripts/audit_skill_config.py
      - name: Policy tests
        run: docker run --rm -v "$PWD/policy:/p" openpolicyagent/opa:1.4.2 test /p -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Policy copy in the k8s base matches /policy
        run: diff policy/tools.rego deploy/k8s/base/policy/tools.rego
      - name: Render and schema-check every overlay
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for o in dev prod; do
            kubectl kustomize deploy/k8s/overlays/$o > /tmp/$o.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas /tmp/$o.yaml
          done

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: "Stack up (no Scarlet Beast backends in CI: tool evals that need them are skipped)"
        run: |
          cp .env.example .env
          docker compose up -d --build postgres mock-entra registry opa
          python scripts/wait_ready.py http://localhost:8410/readyz
      - name: Publish skills through the gates
        run: python scripts/upload_skills.py
      - name: OPA sees the published scopes (it polls the registry bundle every 5-15 s)
        run: |
          for i in $(seq 15); do
            curl -sf localhost:18181/v1/data/beast/skills | python -c "import json,sys; d=json.load(sys.stdin).get('result') or {}; sys.exit('board-standup' not in d)" && exit 0
            sleep 3
          done
          echo "OPA never loaded the published skills"; exit 1

  image:
    runs-on: ubuntu-latest
    needs: [test, manifests]
    if: github.ref == 'refs/heads/main'
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/beast-assist:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/beast-assist:0.1.0
