[project]
name = "beast-assist"
version = "0.1.0"
description = "Beast Assist: governed MCP tools and skills for Scarlet Beast agents"
requires-python = ">=3.10"
dependencies = [
  "mcp==2.2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "fastembed>=0.4",
  "python-multipart>=0.0.9",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
agent = ["langgraph>=1.0", "langchain-core>=1.0", "langchain-aws>=1.0", "boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "libs"}
packages = ["beast_mcp", "beast_rag"]

[tool.pytest.ini_options]
testpaths = ["tests", "servers", "registry"]
asyncio_mode = "auto"
markers = ["integration: needs the docker compose stack (make up)"]
addopts = "-m 'not integration'"
